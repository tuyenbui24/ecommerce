<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>

    <!-- Bootstrap & style -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div id="header-container"></div>

<div class="container mt-5">
    <!-- flash message (success) -->
    <div id="register-message" class="alert alert-success text-center" style="display:none;"></div>

    <!-- form -->
    <form id="registerForm" class="form-register shadow p-4 rounded mx-auto">
        <p class="text-center text-muted">Chào mừng bạn đến với BT!</p>
        <h3 class="text-center mb-4">Đăng ký</h3>

        <!-- First name -->
        <div class="mb-3">
            <label class="form-label">Họ</label>
            <input type="text" class="form-control" name="firstName" placeholder="Họ" required>
            <small id="error-firstName" class="text-danger"></small>
        </div>

        <!-- Last name -->
        <div class="mb-3">
            <label class="form-label">Tên</label>
            <input type="text" class="form-control" name="lastName" placeholder="Tên" required>
            <small id="error-lastName" class="text-danger"></small>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" placeholder="Nhập email" required>
            <small id="error-email" class="text-danger"></small>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <div class="input-group">
                <input type="password" class="form-control" name="password" placeholder="Nhập mật khẩu" id="regPassword" required>
                <button class="btn btn-outline-secondary toggle-pass" type="button"
                        data-target="#regPassword">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <small id="error-password" class="text-danger"></small>
        </div>

        <button class="btn btn-primary w-100 mt-5" type="submit">Đăng ký</button>

        <div class="text-center mt-4">
            <p class="mt-3">
                Bạn đã có tài khoản?
                <a href="/login_form.html" id="show-login-form">Đăng nhập</a>
            </p>
        </div>
    </form>
</div>

<!-- scripts -->
<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
