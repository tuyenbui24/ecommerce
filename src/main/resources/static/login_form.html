<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập</title>

    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div id="header-container"></div>

<div class="container mt-5">
    <!-- THÔNG BÁO lỗi hoặc logout -->
    <div id="login-error" class="alert alert-danger text-center" style="display:none;">
        Email hoặc mật khẩu không đúng!
    </div>
    <div id="login-success" class="alert alert-success text-center" style="display:none;">
        Đã đăng xuất thành công.
    </div>
    <div id="login-message" class="alert alert-success text-center" style="display:none;"></div>

    <!-- FORM LOGIN -->
    <form id="loginForm" class="form-login shadow p-4 rounded mx-auto">
        <h3 class="text-center mb-4">Đăng nhập</h3>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control"
                   name="username" placeholder="Nhập email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <div class="input-group">
                <input type="password" class="form-control"
                       name="password" placeholder="Nhập mật khẩu" id="loginPassword" required>
                <button class="btn btn-outline-secondary toggle-pass" type="button"
                        data-target="#loginPassword">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-5" type="submit">Đăng nhập</button>

        <div class="text-center mt-4">
            <p class="mt-3">
                Bạn chưa có tài khoản?
                <a href="/register_form.html" id="show-register-form">ĐĂNG KÝ</a>
            </p>
        </div>
    </form>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/login_form.js"></script>
</body>
</html>
