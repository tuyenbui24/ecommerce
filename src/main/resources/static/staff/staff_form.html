<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Form nhân viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/fontawesome/css/all.min.css" rel="stylesheet" />
    <link href="/css/main.css" rel="stylesheet" />
</head>
<body>

<div id="header-container"></div>

<div class="container mt-content">
    <h2 class="text-center mb-4" id="form-title">Thêm nhân viên</h2>
    <div id="errorBox" class="alert alert-danger text-center d-none"></div>

    <form id="staffForm" class="col-md-8 offset-md-2 border rounded p-4 shadow-sm bg-light" enctype="multipart/form-data">
        <input type="hidden" id="staffId" />

        <div class="mb-3">
            <label class="form-label">Họ:</label>
            <input type="text" id="lastName" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Tên:</label>
            <input type="text" id="firstName" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" id="email" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu:</label>
            <input type="password" id="password" class="form-control" placeholder="Để trống nếu không thay đổi" />
        </div>

        <div class="mb-3">
            <label class="form-label">Ảnh đại diện:</label>
            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" />
            <div class="mt-2" id="photoPreviewContainer" class="d-none">
                <img id="photoPreview" src="" style="max-height: 120px;" alt="Ảnh nhân viên" />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Vai trò:</label>
            <div class="row" id="rolesContainer">
                <!-- Roles will be loaded here -->
            </div>
        </div>

        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="enabled" />
            <label class="form-check-label" for="enabled">Kích hoạt tài khoản</label>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk"></i> Lưu nhân viên
            </button>
        </div>
    </form>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/fontawesome/js/all.min.js"></script>
<script src="/js/staff/staff_form.js"></script>
</body>
</html>
